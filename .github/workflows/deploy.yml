# .github/workflows/notify-slack.yml
name: Notify Slack

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"✅ Déploiement réussi !\n📦 ${{ github.repository }}\n🌿 ${{ github.ref_name }}\n🔗 https://dashboard-recepie.vercel.app\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}
