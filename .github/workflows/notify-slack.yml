# .github/workflows/notify-slack.yml
name: Notify Slack on Deploy

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Pas besoin de checkout ! On utilise les variables GitHub
      - name: Send Slack notification
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d '{
              "text": "🚀 *Nouveau déploiement sur Vercel*",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚀 Nouveau déploiement sur Vercel"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*✅ Statut:*\nSuccès"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*📦 Projet:*\n${{ github.repository }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*🌿 Branche:*\n`${{ github.ref_name }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🔗 URL:*\nhttps://dashboard-recepie.vercel.app"
                    }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*📝 Commit:*\n`${{ github.sha }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*👤 Auteur:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*💬 Message:*\n${{ github.event.head_commit.message }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*🕐 Date:*\n${{ github.event.head_commit.timestamp }}"
                    }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "🔗 <https://dashboard-recepie.vercel.app|Voir le site> • <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|Voir le commit>"
                    }
                  ]
                }
              ]
            }' \
            ${{ secrets.SLACK_WEBHOOK_URL }}
